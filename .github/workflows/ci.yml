name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm typecheck

      - name: 린트
        run: pnpm lint

      - name: 유닛 테스트
        run: pnpm test

      # Supabase 환경변수는 실행 시점에만 검증되므로(lib/env.ts) 빌드에는 필요하지 않다
      - name: 프로덕션 빌드
        run: pnpm build
